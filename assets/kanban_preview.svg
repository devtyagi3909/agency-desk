<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8fafc" rx="8" />
  <g transform="translate(20, 20)">
    <text x="0" y="24" font-family="sans-serif" font-weight="bold" font-size="24" fill="#0f172a">Project Kanban</text>
    
    <!-- Todo Column -->
    <g transform="translate(0, 60)">
      <rect width="180" height="480" fill="#f1f5f9" rx="6" />
      <text x="12" y="24" font-family="sans-serif" font-weight="bold" font-size="14" fill="#334155">Todo</text>
      <!-- Task Card 1 -->
      <g transform="translate(10, 40)">
        <rect width="160" height="80" fill="#ffffff" stroke="#cbd5e1" rx="4" />
        <text x="10" y="24" font-family="sans-serif" font-weight="500" font-size="13" fill="#0f172a">Design System</text>
        <text x="10" y="44" font-family="sans-serif" font-size="11" fill="#64748b">Create color palette</text>
        <rect x="10" y="56" width="40" height="16" fill="#fef3c7" rx="8" />
        <text x="18" y="67" font-family="sans-serif" font-size="9" font-weight="600" fill="#92400e">Medium</text>
      </g>
      <!-- Task Card 2 -->
      <g transform="translate(10, 130)">
        <rect width="160" height="80" fill="#ffffff" stroke="#cbd5e1" rx="4" />
        <text x="10" y="24" font-family="sans-serif" font-weight="500" font-size="13" fill="#0f172a">Setup DB</text>
        <text x="10" y="44" font-family="sans-serif" font-size="11" fill="#64748b">PostgreSQL schemas</text>
        <rect x="10" y="56" width="34" height="16" fill="#fee2e2" rx="8" />
        <text x="16" y="67" font-family="sans-serif" font-size="9" font-weight="600" fill="#991b1b">High</text>
      </g>
    </g>

    <!-- In Progress Column -->
    <g transform="translate(192, 60)">
      <rect width="180" height="480" fill="#f1f5f9" rx="6" />
      <text x="12" y="24" font-family="sans-serif" font-weight="bold" font-size="14" fill="#334155">In Progress</text>
      <!-- Task Card 1 -->
      <g transform="translate(10, 40)">
        <rect width="160" height="80" fill="#ffffff" stroke="#cbd5e1" rx="4" />
        <text x="10" y="24" font-family="sans-serif" font-weight="500" font-size="13" fill="#0f172a">Auth API</text>
        <text x="10" y="44" font-family="sans-serif" font-size="11" fill="#64748b">Implement JWT auth</text>
        <rect x="10" y="56" width="34" height="16" fill="#fee2e2" rx="8" />
        <text x="16" y="67" font-family="sans-serif" font-size="9" font-weight="600" fill="#991b1b">High</text>
      </g>
    </g>

    <!-- In Review Column -->
    <g transform="translate(384, 60)">
      <rect width="180" height="480" fill="#f1f5f9" rx="6" />
      <text x="12" y="24" font-family="sans-serif" font-weight="bold" font-size="14" fill="#334155">In Review</text>
      <!-- Task Card 1 -->
      <g transform="translate(10, 40)">
        <rect width="160" height="80" fill="#ffffff" stroke="#cbd5e1" rx="4" />
        <text x="10" y="24" font-family="sans-serif" font-weight="500" font-size="13" fill="#0f172a">Homepage UI</text>
        <text x="10" y="44" font-family="sans-serif" font-size="11" fill="#64748b">Hero section design</text>
        <rect x="10" y="56" width="34" height="16" fill="#dcfce7" rx="8" />
        <text x="16" y="67" font-family="sans-serif" font-size="9" font-weight="600" fill="#166534">Low</text>
      </g>
    </g>

    <!-- Done Column -->
    <g transform="translate(576, 60)">
      <rect width="180" height="480" fill="#f1f5f9" rx="6" />
      <text x="12" y="24" font-family="sans-serif" font-weight="bold" font-size="14" fill="#334155">Done</text>
      <!-- Task Card 1 -->
      <g transform="translate(10, 40)">
        <rect width="160" height="80" fill="#ffffff" stroke="#cbd5e1" rx="4" />
        <text x="10" y="24" font-family="sans-serif" font-weight="500" font-size="13" fill="#0f172a">Project setup</text>
        <text x="10" y="44" font-family="sans-serif" font-size="11" fill="#64748b">Init Next.js and FastAPI</text>
        <rect x="10" y="56" width="34" height="16" fill="#fee2e2" rx="8" />
        <text x="16" y="67" font-family="sans-serif" font-size="9" font-weight="600" fill="#991b1b">High</text>
      </g>
