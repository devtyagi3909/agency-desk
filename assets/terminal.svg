<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <style>
    .text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 15px; fill: #a9b1d6; }
    .prompt { fill: #7aa2f7; font-weight: bold; }
    .command { fill: #9ece6a; font-weight: bold; }
    .success { fill: #73daca; }
    
    .line1, .line2, .line3, .line4, .line5 { opacity: 0; }
    
    @keyframes type {
      0% { opacity: 0; }
      1% { opacity: 1; }
      100% { opacity: 1; }
    }
    
    .line1 { animation: type 8s infinite 0.5s; }
    .line2 { animation: type 8s infinite 2.0s; }
    .line3 { animation: type 8s infinite 3.0s; }
    .line4 { animation: type 8s infinite 4.0s; }
    .line5 { animation: type 8s infinite 5.0s; }
  </style>
  
  <!-- Outer Terminal Box with smooth macOS corners -->
  <rect width="100%" height="100%" rx="14" ry="14" fill="#1e1e1e" />
  
  <!-- Header (Top Bar) matching the rounded corners -->
  <path d="M0,14 a14,14 0 0,1 14,-14 h772 a14,14 0 0,1 14,14 v16 h-800 v-16 z" fill="#2d2d2d" />
  
  <!-- Native Mac OS Window Buttons -->
  <circle cx="22" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="15" r="6" fill="#27c93f"/>
  
  <!-- Terminal Content -->
  <g transform="translate(22, 65)">
    <text y="0" class="line1 text">
      <tspan class="prompt">devtyagi@macbook</tspan>:<tspan class="prompt">~/agency-desk$</tspan> <tspan class="command">docker compose up --build</tspan>
    </text>
    <text y="30" class="line2 text">[+] Building 11.2s (23/23) FINISHED</text>
    <text y="55" class="line3 text">[+] Running 3/3</text>
    <text y="80" class="line4 text"> ✔ Container agencydesk-db-1        <tspan class="success">Started</tspan></text>
    <text y="105" class="line5 text"> ✔ Container agencydesk-backend-1   <tspan class="success">Started</tspan></text>
    <text y="130" class="line5 text"> ✔ Container agencydesk-frontend-1  <tspan class="success">Started</tspan></text>
  </g>
</svg>
